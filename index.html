<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABP TV</title>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- HLS.js for HLS (.m3u8) Playback Support in Modern Browsers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.11/dist/hls.min.js"></script>
</head>
<body>

  <!-- Background Player Container (used for Language Screen backdrop image) -->
  <div id="background-player-container">
    <div id="backdrop-image"></div>
  </div>

  <!-- Splash Screen Overlay -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo-container">
        <img src="assets/language_logos/live_h.svg" class="splash-logo" alt="ABP Live Logo">
      </div>
      <div class="splash-bottom-icons">
        <div class="splash-bottom-logo logo-news"><img src="assets/language_logos/news_h.svg" alt="ABP News"></div>
        <div class="splash-bottom-logo logo-majha"><img src="assets/language_logos/majha_h.svg" alt="ABP Majha"></div>
        <div class="splash-bottom-logo logo-ananda"><img src="assets/language_logos/ananda_h.svg" alt="ABP Ananda"></div>
        <div class="splash-bottom-logo logo-asmita"><img src="assets/language_logos/asmita_h.svg" alt="ABP Asmita"></div>
        <div class="splash-bottom-logo logo-sanjha"><img src="assets/language_logos/sanjha_h.svg" alt="ABP Sanjha"></div>
        <div class="splash-bottom-logo logo-nadu"><img src="assets/language_logos/nadu_h.svg" alt="ABP Nadu"></div>
        <div class="splash-bottom-logo logo-desam"><img src="assets/language_logos/desam_h.svg" alt="ABP Desam"></div>
        <div class="splash-bottom-logo logo-ganga"><img src="assets/language_logos/ganga_h.svg" alt="ABP Ganga"></div>
      </div>
    </div>
  </div>

  <!-- Language Selection Screen -->
  <div id="language-screen" class="screen-view">
    <div class="language-view-overlay-red"></div>
    <div class="language-view-overlay-black"></div>
    <div class="language-content">
      <div class="language-title">Choose your language</div>
      <div class="language-center-group">
        <div class="language-logo-preview-container">
          <img id="language-logo-preview" src="" alt="ABP Live Logo Preview">
        </div>
        <div id="language-subtitle"></div>
      </div>
      <div class="language-selector-strip">
        <div id="language-strip-container"></div>
      </div>
    </div>
  </div>

  <!-- Global Sidebar Wrapper -->
  <div id="global-sidebar-container" style="display: none;">
    <!-- Menu Pill (Top-left button when drawer is collapsed to 0) -->
    <div id="menu-pill" class="hidden">
      <!-- Back Chevron Arrow -->
      <span class="pill-back-arrow" style="display: inline-flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </span>
      <div class="pill-button">
        <div class="pill-avatar">
          <img src="assets/profile_pic.png" alt="Guest User">
        </div>
        <span class="pill-label">Menu</span>
      </div>
    </div>

    <!-- Navigation Drawer (Sidebar) -->
    <div id="navigation-drawer" class="drawer-icons">
      <div class="drawer-profile-section">
        <div id="drawer-profile-avatar">
          <img src="assets/profile_pic.png" alt="Guest User">
        </div>
        <div id="drawer-profile-name">Guest</div>
      </div>
      <div class="drawer-menu-items top-items" id="drawer-top-menu"></div>
      <div class="drawer-menu-items bottom-items" id="drawer-bottom-menu"></div>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen" class="screen-view">
    <div id="home-bg-backdrop"></div>
    <video id="live-video-element" playsinline muted></video>

    <!-- Home Main Content Area -->
    <div class="home-content" style="position: relative; z-index: 10; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end;">
      <!-- Active Channel Hero Section (Hidden to prevent overlaps and match Mockup) -->
      <div class="hero-carousel-rail" style="display: none; height: 140px; margin-bottom: 12px; width: 100%;">
        <div class="hero-watermark" style="position: relative; left: 0; top: 0; transform: none; opacity: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; width: 100%;">
          <div style="display: flex; align-items: center; margin-bottom: 6px;">
            <img id="home-brand-logo" src="" alt="ABP Channel Logo" style="height: 36px; object-fit: contain;">
          </div>
          <div id="home-active-section-title" style="font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 2px;">Top TV Shows</div>
          <div id="home-active-section-desc" style="font-size: 12px; color: #aaa; max-width: 500px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Catch the latest episodes from your favourite TV shows.</div>
        </div>
      </div>

      <!-- Home Rails Scroll Area -->
      <div id="home-rails-container"></div>
    </div>

    <div id="live-player-controls" class="hero-player-controls">
      <div class="hero-controls-buttons">
        <button id="player-btn-mute" class="hero-control-btn-circle" type="button" aria-label="Mute">
          <svg id="svg-mute-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>
          </svg>
        </button>
        <button id="player-btn-fullscreen" class="hero-control-btn-circle" type="button" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 3v-3h2v5h-5v-2h3z"></path>
          </svg>
        </button>
      </div>
      <div class="hero-progress-bar-container">
        <div class="hero-progress-track">
          <div id="player-progress-fill" class="hero-progress-fill"></div>
          <div id="player-progress-knob" class="hero-progress-knob"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Screen -->
  <div id="search-screen" class="screen-view">
    <div class="search-layout-container">
      
      <!-- Left Panel: Top Nav Row (Back, Profile, Search bar capsule, Voice button) -->
      <div class="search-left-panel">
        
        <!-- Top bar containing Back arrow and Input capsule -->
        <div class="search-input-wrapper">
          <div id="search-back-btn" class="search-back-arrow-wrapper">
            <svg class="search-back-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </div>
          <div class="search-bar" id="search-bar-input-field">
            <span class="search-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A8A" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <div id="search-query-display" class="search-placeholder">Search for shows, videos...</div>
          </div>
        </div>

        <!-- Suggestions/History Chips -->
        <div id="search-suggestions-container" class="search-history-container">
          <!-- Dynamically populated in JavaScript -->
        </div>

      </div>

      <!-- Right Panel: On-Screen Keyboard -->
      <div class="search-right-panel">
        <div id="tv-keyboard">
          <!-- Dynamically populated in JavaScript -->
        </div>
      </div>

    </div>

    <!-- Search Results heading and row underneath both panels -->
    <div id="search-results-section" style="display: none;">
      <div id="search-results-title" style="font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 16px; letter-spacing: 0.5px;"></div>
      <div id="search-results-container" class="search-results-row"></div>
    </div>
  </div>

  <!-- Videos Screen -->
  <div id="videos-screen" class="screen-view">
    <div class="videos-layout-container">
      <div id="videos-back-btn" class="videos-back-btn">
        <svg class="videos-back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Go Back</span>
      </div>
      <div class="videos-screen-title">Videos</div>
      <div id="videos-grid-container" class="videos-grid-scroll-inner">
        <!-- Dynamically populated from API -->
      </div>
    </div>
  </div>

  <!-- TV Shows Screen -->
  <div id="tvshows-screen" class="screen-view">
    <div class="generic-list-layout">
      <div id="tvshows-back-btn" class="generic-back-btn">
        <svg class="generic-back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Go Back</span>
      </div>
      <div class="generic-screen-title">TV Shows</div>
      <div id="tvshows-grid-container" class="tvshows-grid-scroll-inner">
        <!-- Dynamically populated from API -->
      </div>
    </div>
  </div>

  <!-- Short Videos Screen -->
  <div id="shortvideos-screen" class="screen-view">
    <div class="generic-list-layout">
      <div id="shortvideos-back-btn" class="generic-back-btn">
        <svg class="generic-back-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Go Back</span>
      </div>
      <div class="generic-screen-title">Short Videos</div>
      <div id="shortvideos-grid-container" class="shortvideos-grid-scroll-inner">
        <!-- Dynamically populated from API -->
      </div>
    </div>
  </div>

  <!-- Error Toast Container -->
  <div id="error-toast" class="hidden-element"></div>

  <!-- Exit Confirmation Popup -->
  <div id="exit-popup" class="exit-popup-overlay" style="display:none;">
    <div class="exit-popup-box">
      <div class="exit-popup-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
      <div class="exit-popup-title">Exit App?</div>
      <div class="exit-popup-subtitle">Are you sure you want to exit ABP Live?</div>
      <div class="exit-popup-buttons">
        <button id="exit-popup-cancel" class="exit-popup-btn exit-popup-btn--cancel">Stay</button>
        <button id="exit-popup-confirm" class="exit-popup-btn exit-popup-btn--confirm">Exit</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
